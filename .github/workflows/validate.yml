name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            -o mcp-publisher.tar.gz
          tar xzf mcp-publisher.tar.gz mcp-publisher
          chmod +x mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Smoke test the endpoint (must require auth)
        run: |
          set -euo pipefail
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST https://mlab.sh/mcp)
          echo "POST https://mlab.sh/mcp returned $code"
          if [ "$code" != "401" ]; then
            echo "Expected 401 (endpoint up and requiring auth), got $code"
            exit 1
          fi
